services:
  stereo:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${JETSON_ROS_BASE_IMAGE:?Set a verified JetPack-compatible ROS 2 image in .env}
    image: jetbot-stereo:local
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ./calibration:/data/calibration:ro
      - ./maps:/data/maps
    stdin_open: true
    tty: true
